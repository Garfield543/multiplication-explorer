:root{color-scheme:light;--ink:#182e2c;--muted:#4e655b;--green:#145747;--mint:#deefe3;--paper:#fffdf6;--line:#cbdacf;--gold:#ffe6a1}*{box-sizing:border-box}body{margin:0;background:#edf4e9;color:var(--ink);font:500 1.08rem/1.55 "Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100dvh}button,input,select{font:inherit;color:inherit}button,select{min-height:56px;padding:.55rem .95rem;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;touch-action:manipulation;font-weight:750}button:hover:not(:disabled){border-color:var(--green);background:#eff7ef}button.primary{background:var(--gold);border-color:#b38935;box-shadow:0 3px 0 #bb9445}button:disabled{opacity:.64;cursor:default}button[aria-pressed=true],.marked{border-color:#145747!important;box-shadow:0 0 0 3px #91c4a7;background:var(--mint)}:focus-visible{outline:3px solid #2a60b1;outline-offset:3px}header{background:#fffdf6;border-bottom:1px solid var(--line)}.bar,main{width:min(1100px,calc(100% - 32px));margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.65rem 0;flex-wrap:wrap}.brand{font-weight:900;font-size:1.2rem}.row{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem}.bar button{min-height:56px}main{padding:1.4rem 0 3rem}.panel{padding:clamp(1rem,4vw,2.6rem);border:1px solid var(--line);background:var(--paper);border-radius:25px;box-shadow:0 8px 28px #17372112}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:1rem;align-items:center;min-height:420px}.hero-art{width:100%;max-height:310px}.hero p:first-child,.eyebrow{color:var(--green);font-weight:850}h1,h2,p{margin:0 0 .7rem}h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1.25;letter-spacing:-.035em}h2{font-size:clamp(1.5rem,4vw,2.15rem);line-height:1.55}.sub{font-size:1.25rem;color:var(--muted)}.map{margin:1rem 0;display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}.map button{padding:.55rem .45rem}.meters{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1rem;color:var(--muted)}progress{accent-color:var(--green);display:block;width:100%;height:12px}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.85rem;margin:1rem 0}.basket{display:grid;align-content:space-between;gap:.35rem;min-width:0;padding:.6rem;border:2px solid #d3ccac;border-radius:17px;text-align:center;background:#fbf4db}.tray{min-height:64px;display:flex;align-content:center;justify-content:center;flex-wrap:wrap;gap:.2rem;padding:.4rem;background:repeating-linear-gradient(0deg,#e3b06d 0 5px,#f0c88c 5px 9px);border:2px solid #966537;border-radius:8px 8px 18px 18px}.group-counter{width:18px;height:18px;border-radius:50%;border:2px solid #323c64;background:#c2cef0}.changed-group{border:3px dashed var(--green);background:#e5f2e8}.removed-group{border-color:#965247;background:#fbebe4}.removed-group .tray{opacity:.48}.basket .row{justify-content:center}.token{width:38px;height:38px;vertical-align:middle}.fruit{min-width:56px;padding:.25rem;touch-action:none}.ghost{display:inline-block;border:2px dashed #774d26;border-radius:50%;width:32px;height:32px}.drop{border-color:#145747;background:#dcefe1}.pool{padding:.65rem;border-radius:12px;background:#e8f2f9;margin-top:1rem}.answer{margin:1rem 0}.num{min-width:56px;font-size:1.36rem;font-variant-numeric:tabular-nums}.numeric-label{display:inline-flex;align-items:center;gap:.4rem}.numeric{width:4.5rem;min-height:56px;border:2px solid var(--line);border-radius:12px;padding:.4rem}.message{background:#e5f2e8;border-left:4px solid #418166;padding:.6rem .8rem;border-radius:7px;margin:.8rem 0}.message:empty{display:none}.help{background:#fff0c6;padding:.75rem;border-radius:12px;margin:.75rem 0}.equation{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-size:1.55rem;margin:.8rem 0}.solution-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:.8rem 0}.alternate-solution{border-inline-start:2px solid var(--green);padding-inline-start:1rem}.tools{margin-top:1rem}.tools button{font-size:1rem}summary{cursor:pointer;min-height:42px;font-weight:bold}details{margin:.75rem 0}dialog{border:2px solid var(--line);border-radius:20px;padding:1.3rem;background:var(--paper);color:var(--ink);width:min(600px,calc(100% - 24px));max-height:90dvh}dialog::backdrop{background:#182e2c88}dialog label{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.55rem 0}input[type=checkbox]{width:23px;height:23px}canvas{width:100%;height:210px;display:block;background:white;border:2px solid var(--line);border-radius:12px;touch-action:none;margin:.6rem 0}ruby{ruby-align:center}rt{font-size:.45em;color:#365b51}body:not(.zy) rt{display:none}.pop{animation:appear .24s ease-out}@keyframes appear{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}body.still *{animation:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:680px){.hero{grid-template-columns:1fr;min-height:0}.hero-art{max-height:180px}.map{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr))}}@media(max-width:540px){.solution-pair{grid-template-columns:1fr}.alternate-solution{border-inline-start:0;border-block-start:2px solid var(--green);padding:1rem 0 0}}@media(max-width:380px){.bar,main{width:calc(100% - 18px)}.meters{grid-template-columns:1fr}.panel{padding:.8rem}}
.add-basket{border-style:dashed;align-content:center;cursor:pointer}.add-basket .tray{font-size:1.75rem;font-weight:900;color:#253d34}.add-basket strong{display:block;margin-top:.4rem}

<main id="app"></main>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id);
const units=[2,5,4,8];
const labels=['建立一組','倍數魔法','乘法變身術','自由探索','多一組、少一組','綜合練習','生活小店'];
const route=[0,1,2,3,6,4,5];
const themes={
  apple:['蘋果','顆','籃','籃子','裝'],
  flower:['花','朵','束','花束','放'],
  wheel:['輪子','個','輛','小車','有'],
  snack:['章魚燒','顆','盒','點心盒','裝'],
  yogurt:['優格','杯','盤','盤子','放']
};
const defaults={advanced:false,zy:false,auto:false,slow:false,still:false,lock:true,view:'both',max:9,unit:2};
const key='multiply-explorer-v1';
let prefs={...defaults}, done={}, saved=null, visited=false, speechError='';
let s=null, message='', selectedFruit=null, previousMove=null, timer=0, drag=null, ignoreClickUntil=0;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=value=>annotate(esc(value));
const btn=(label,action,attrs='')=>'<button type="button" data-act="'+action+'" '+attrs+'>'+t(label)+'</button>';
const glyph=id=>'<svg class="token" aria-hidden="true" viewBox="0 0 48 48"><use href="#'+id+'"></use></svg>';
const numbered=(start,end)=>Array.from({length:end-start+1},(_,i)=>i+start);
const at=(x,min,max)=>Number.isInteger(x)&&x>=min&&x<=max;
const limits=()=>prefs.advanced||s?.station===3?prefs.max:Math.min(5,prefs.max);
const make=(station=0,unit=2)=>({
  station,unit,step:0,phase:0,groups:1,built:0,fruit:Array(6).fill(0),answer:'',cards:[null,null,null],slot:0,
  solved:false,reveal:0,highlight:-1,hint:0,hide:false
});
const lengths=[5,3,7,8,6,7,4];
const taskKey=()=>s.station===3?'3:'+s.unit:String(s.station);
function count(station,unit){return (done[station===3?'3:'+unit:String(station)]||[]).length}
function unlocked(){return labels.slice(0,3).every((_,i)=>count(i)===lengths[i])}
function allowed(station){
  if(station===undefined)return false;
  if(!prefs.lock||station===0)return true;
  if(station===3)return unlocked();
  if(station===6)return unlocked()&&units.every(unit=>count(3,unit)===lengths[3]);
  if(station===4)return count(6)===lengths[6]||count(4)>0||count(5)>0;
  return count(station-1)===lengths[station-1];
}
function validState(value){
  if(!value||!at(value.station,0,lengths.length-1)||!units.includes(value.unit)||!at(value.step,0,lengths[value.station]-1)||!at(value.groups,1,9))return null;
  const clean=make(value.station,value.unit);
  clean.built=at(value.built,0,value.unit+1)?value.built:0;
  if(value.station===0&&Array.isArray(value.fruit)&&value.fruit.length===6&&value.fruit.every(n=>at(n,0,2)))clean.fruit=value.fruit;
  Object.assign(clean,{step:value.step,phase:value.station>=4&&value.phase===1?1:0,groups:value.groups,solved:value.solved===true,reveal:at(value.reveal,0,3)?value.reveal:0});
  if(clean.station===0&&clean.step>0&&clean.fruit.filter(n=>n===1).length!==2)return make();
  if(clean.station===0&&clean.step>2&&clean.fruit.filter(n=>n===2).length!==2)return make();
  return clean;
}
try{
  const data=JSON.parse(localStorage.getItem(key));
  if(data&&typeof data==='object'){
    for(const name of Object.keys(defaults)){
      const value=data.prefs?.[name];
      if(typeof defaults[name]==='boolean'&&typeof value==='boolean')prefs[name]=value;
    }
    if(at(data.prefs?.max,1,9))prefs.max=data.prefs.max;
    if(units.includes(data.prefs?.unit))prefs.unit=data.prefs.unit;
    if(['both','pictures','numbers'].includes(data.prefs?.view))prefs.view=data.prefs.view;
    for(const [station,length] of lengths.entries()){
      for(const unit of station===3?units:[2]){
        const k=station===3?'3:'+unit:String(station);
        if(Array.isArray(data.done?.[k]))done[k]=[...new Set(data.done[k].filter(n=>at(n,0,length-1)))];
      }
    }
    saved=validState(data.saved);
    visited=Boolean(saved);
  }
}catch{}
function save(){
  if(s){saved=validState(s);visited=Boolean(saved)}
  try{localStorage.setItem(key,JSON.stringify({prefs,done,saved}))}catch{}
}
function finish(text){
  stop();
  const k=taskKey();
  if(!task().followup)done[k]=[...new Set([...(done[k]||[]),s.step])];
  s.solved=true; s.hint=0; message=text;
  if([4,5].includes(s.station)&&!task().amounts&&['formula','roles'].includes(task().kind))return next();
  save();render();
  document.querySelector('[data-act="next"]')?.focus({preventScroll:true});
}
function stop(){
  clearTimeout(timer); timer=0;
  window.speechSynthesis?.cancel();
}
function resetTask(){
  stop(); Object.assign(s,{answer:'',cards:[null,null,null],slot:0,solved:false,reveal:0,highlight:-1,hint:0});
  message='';speechError='';selectedFruit=null;previousMove=null;
}
function enter(station,unit=2){
  stop();s=make(station,unit); if(station===1)s.groups=Math.min(3,limits());
  if(station===2)s.groups=3;
  resetTask();save();render(true);autoRead();
}
function home(){
  stop(); save();s=null;message='';render();
}
function stage(){
  const {station,step}=s;
  const transfer=station===2&&step===6;
  const unit=transfer?4:station===3?s.unit:2;
  const theme=transfer?'yogurt':station===3?({2:'apple',5:'flower',4:'wheel',8:'snack'}[unit]):'apple';
  const [item,measure,group,container,verb]=themes[theme];
  const groups=station===2?3:s.groups;
  return {unit,theme,item,measure,group,container,verb,groups,total:unit*groups};
}
function context(m){
  return '每'+m.group+m.verb+' '+m.unit+' '+m.measure+m.item+'，有 '+m.groups+' '+m.group+'。';
}
const groupPractice=[
  {unit:4,theme:'yogurt',groups:3,delta:1,group:'組',item:'優格',measure:'杯'},
  {unit:8,theme:'snack',groups:5,delta:-1,group:'盒',item:'章魚燒',measure:'顆'}
];
const mixedPractice=[
  {unit:5,groups:6,delta:0,group:'袋',item:'彈珠',measure:'顆',kind:'formula'},
  {unit:2,groups:7,delta:-2,group:'盒',item:'粉筆',measure:'枝',kind:'number'},
  {unit:8,groups:2,delta:4,group:'包',item:'貼紙',measure:'張',kind:'number'},
  {unit:4,groups:5,delta:3,group:'排',item:'椅子',measure:'張',kind:'difference'},
  {unit:2,groups:9,delta:0,group:'束',item:'氣球',measure:'個',kind:'formula'},
  {unit:5,groups:8,delta:-3,group:'盤',item:'餅乾',measure:'片',kind:'difference'}
];
const shopPractice=[
  {unit:5,group:'袋',item:'糖果',measure:'顆',amounts:[5,5,5]},
  {unit:0,group:'袋',item:'糖果',measure:'顆',amounts:[5,4,5]},
  {unit:0,group:'盒',item:'蛋糕',measure:'塊',amounts:[8,4]},
  {unit:8,group:'盒',item:'蛋糕',measure:'塊',amounts:[8,8,8,8]}
];
const finalSituation={unit:0,group:'排',item:'書',measure:'本',amounts:[4,4,2]};
function situationTask(data){
  const {unit,group,item,measure,amounts}=data;
  const groups=amounts.length, total=amounts.reduce((sum,n)=>sum+n,0);
  const question=unit?'請拼出乘法算式。':'一共有幾'+measure+item+'？';
  const context=amounts.map((n,i)=>'第 '+(i+1)+' '+group+'有 '+n+' '+measure+item).join('，')+'。';
  return {...data,groups,total,answer:s.phase?total:Number(Boolean(unit)),answerUnit:measure,
    kind:s.phase?(unit?'formula':'number'):'strategy',
    text:context+(s.phase?question:'照現在的分法，可以用一道乘法算式表示全部的'+item+'嗎？'),
    followup:s.phase===0,reason:unit?'每'+group+'都一樣多，可以用乘法求總數。':'每'+group+'的數量不一樣多，把各'+group+'的數量加起來。'};
}
function practiceTask(){
  if(s.station===6)return situationTask(shopPractice[s.step]);
  if(s.station===5&&s.step===mixedPractice.length)return situationTask(finalSituation);
  const guided=s.station===4;
  const data=guided?groupPractice[Math.floor(s.step/3)]:mixedPractice[s.step];
  const {unit,groups,delta,group,item,measure}=data;
  const kind=guided?['formula','number','difference'][s.step%3]:data.kind;
  const after=groups+delta, direction=delta>0?'多':'少';
  const total=unit*groups, afterTotal=unit*after;
  const setup='每'+group+'有 '+unit+' '+measure+item+'，原來有 '+groups+' '+group+'。';
  const changed=delta>0?'又增加 '+delta+' '+group+'，現在共有幾'+measure+item+'？':'拿走 '+Math.abs(delta)+' '+group+'，還剩幾'+measure+item+'？';
  const compare=unit+' × '+after+' 比 '+unit+' × '+groups+' '+direction+'幾個 '+unit+'？';
  let text=kind==='formula'?'每'+group+'有 '+unit+' '+measure+item+'，有 '+groups+' '+group+'，共有幾'+measure+item+'？請拼出乘法算式。':
    kind==='number'?setup+changed:guided?compare:'每'+group+'有 '+unit+' '+measure+item+'。原來有 '+groups+' '+group+'，現在有 '+after+' '+group+'。'+compare;
  if(kind==='formula'&&s.phase===1){
    return {...data,kind:'roles',text:'根據算式，填出被乘數、乘數和積。',total,after};
  }
  if(kind==='number'&&s.phase===0){
    const change=delta>0?'又增加 ':'拿走 ';
    text=setup+change+Math.abs(delta)+' '+group+'，現在有幾'+group+'？';
    return {...data,kind:'groupsAfter',text,total,after,answer:after,answerUnit:group,followup:true};
  }
  if(kind==='number')text='現在有 '+after+' '+group+'，每'+group+'有 '+unit+' '+measure+item+'，共有幾'+measure+item+'？';
  return {...data,kind,text,total,after,afterTotal,followup:kind==='formula',direction,
    answer:kind==='difference'?Math.abs(delta):kind==='formula'?total:afterTotal,answerUnit:kind==='difference'?'個':measure,guided};
}
function task(){
  if(s.station>=4)return practiceTask();
  const m=stage(), step=s.step;
  const contextTotal=context(m)+'一共有幾'+m.measure+'？';
  const formula=context(m)+'請拼出乘法算式。';
  const question=(text,kind,answer,answerUnit=m.measure)=>({...m,text,kind,answer,answerUnit});
  if(s.station===0)return [
    question('請放 2 顆蘋果進籃子。','place',2),
    question('第 1 籃有幾顆蘋果？','number',2),
    question('再做一籃一樣多的蘋果吧！','place',2),
    question('一共有幾籃？','number',2,m.group),
    question('每籃的蘋果都一樣多嗎？','yes',1)
  ][step];
  if(s.station===1)return [
    question(contextTotal,'number',m.total),
    question('有 '+m.groups+' 個 2。這是 2 的幾倍？','number',m.groups,'倍'),
    question('再加一籃，會多幾顆蘋果？','compare',2)
  ][step];
  if(s.station===2)return [
    question('每籃有幾顆蘋果？','number',2),
    question('一共有幾籃？','number',3,m.group),
    question('一共有幾顆蘋果？','number',6),
    question('點一點連加算式裡的數字，找出它是哪一籃。','add',null),
    question('看看乘法算式。每個數字代表什麼？','demo',null),
    question(formula,'formula',null),
    question(formula,'formula',null)
  ][step];
  return [
    question('請把 '+m.unit+' '+m.measure+m.item+'放進第一'+m.group+'。','build',m.unit),
    question('按「再加一'+m.group+'」，做出一樣多的'+m.container+'。','copy',null),
    question(contextTotal,'number',m.total),
    question('點一點連加算式裡的數字，看看它代表哪一'+m.group+'。','add',null),
    question('有 '+m.groups+' 個 '+m.unit+'。這是 '+m.unit+' 的幾倍？','number',m.groups,'倍'),
    question(formula,'formula',null),
    question('再多一'+m.group+'，會多幾'+m.measure+m.item+'？','compare',m.unit),
    question('買了 '+m.groups+' '+m.group+(m.theme==='apple'?'蘋果':m.theme==='snack'?'章魚燒':m.theme==='flower'?'花':m.container)+'。'+context(m)+'一共有幾'+m.measure+'？','number',m.total)
  ][step];
}
function nextStation(){return route[route.indexOf(s.station)+1]}
function nextUnit(){return units.find(unit=>count(3,unit)<lengths[3])}
function next(){
  if(s.solved&&task().followup){
    s.phase=1;resetTask();save();render(true);autoRead();return;
  }
  if(!s.solved)return;
  if(s.station===3&&task().kind==='compare'&&s.reveal&&s.groups<limits())s.groups++;
  if(s.step+1<lengths[s.station]){
    s.step++;s.phase=0;resetTask();save();render(true);autoRead();
  }else if(s.station===3&&nextUnit()!==undefined)enter(3,nextUnit());
  else if(allowed(nextStation()))enter(nextStation());
  else home();
}
function back(){
  if(s.phase===1){
    s.phase=0;resetTask();save();render(true);autoRead();return;
  }
  if(s.step>0){
    s.step--;
    if(s.station===0&&s.step<2)s.fruit=s.fruit.map(n=>n===2?0:n);
    resetTask();save();render(true);autoRead();
  }else if(s.station>0)enter(route[route.indexOf(s.station)-1]);
  else home();
}

function practiceBoard(m){

function practiceReview(m){
  if(m.amounts){
    if(m.kind==='strategy')return '<p class="help">'+t(m.reason)+'</p>';
    const sum=m.amounts.join(' ＋ ')+' ＝ '+m.total;
    const multiply=m.unit?equation(m):'';
    return '<p class="equation">'+t(sum)+'</p>'+multiply+
      (s.station===5?'<div class="help"><h3>'+t('我會用乘法')+'</h3><ol>'+
        ['先看每組是不是一樣多。','找出每組有幾個、有幾組。','每組數量 × 組數 ＝ 總數。','每組數量不一樣多，就把各組數量加起來。'].map(line=>'<li>'+t(line)+'</li>').join('')+
        '</ol><p>'+t('想一想：生活中還有哪些可以用乘法算的情形？')+'</p></div>':'');
  }
  if(m.kind==='formula'||m.kind==='roles')return '';
  if(m.kind==='difference'){
    const larger=Math.max(m.groups,m.after), smaller=Math.min(m.groups,m.after);
    const lines=['從 '+m.groups+' '+m.group+' 變成 '+m.after+' '+m.group+'，',
      larger+' '+m.group+' − '+smaller+' '+m.group+' ＝ '+m.answer+' '+m.group+'，',
      m.direction+'了 '+m.answer+' 個 '+m.unit+'。'];
    return '<p><strong>'+lines.map(t).join('<br>')+'</strong></p>';
  }
  const sign=m.delta>0?'＋':'－';
  const quantity=n=>n+' '+m.group;
  const groups='<p class="equation">'+t(quantity(m.groups)+' '+sign+' '+quantity(Math.abs(m.delta))+' ＝ '+quantity(m.after))+'</p>';
  if(m.kind!=='number')return groups;
  const updated='<p class="equation"><strong>'+t(m.unit+' × '+m.after+' ＝ '+m.afterTotal)+'</strong></p>';
  const original='<p class="equation"><strong>'+t(m.unit+' × '+m.groups+' ＝ '+m.total)+'</strong></p>';
  const changedGroups=Math.abs(m.delta), changedTotal=m.unit*changedGroups;
  const changed='<p class="equation"><strong>'+t(m.unit+' × '+changedGroups+' ＝ '+changedTotal)+'</strong></p>';
  const change='<p class="equation">'+t(m.total+' '+sign+' '+changedTotal+' ＝ '+m.afterTotal)+'</p>';
  return '<div class="solution-pair"><div>'+groups+updated+'</div><div class="alternate-solution"><strong>'+
    t('另一種寫法')+'</strong>'+original+changed+change+'</div></div>';
}

function numberCards(m){

  const amount=s.fruit.filter(n=>n===i+1).length;

function check(){
  if(s.solved)return;
  const m=task();
  let correct=false;
  let feedback='再試一次。';
  if(m.kind==='place'){
    correct=s.fruit.filter(n=>n===(s.step===0?1:2)).length===2;
    feedback=s.step===0?'數數第 1 籃裡的蘋果。':'看看兩個籃子，是不是一樣多？';
  }else if(m.kind==='build'){
    correct=s.built===m.unit;
  }else if(m.kind==='copy'){
    correct=s.groups>=2||limits()===1;
    feedback='先試試再加一組。';
  }else if(m.kind==='formula'||m.kind==='roles'){
    correct=s.cards.every((n,i)=>n===[m.unit,m.groups,m.total][i]);
    if(m.kind==='formula'&&!correct&&s.cards[0]===m.groups&&s.cards[1]===m.unit&&s.cards[2]===m.total){
      feedback='你算出的總數也是 '+m.total+'！再看看這題，每'+m.group+'有幾'+m.measure+'？一共有幾'+m.group+'？';
    }
  }else{
    if(!s.answer){message=['yes','strategy'].includes(m.kind)?'請選一個答案。':'選一張數字卡，或輸入答案。';render();return}
    correct=Number(s.answer)===m.answer;
  }
  if(correct){
    if(s.station===1&&s.step===0)s.reveal=1;
    if(m.kind==='compare'){s.reveal=1;s.highlight=m.groups}
    const praise=m.kind==='formula'?'你把等量分組寫成乘法了！':
      m.kind==='compare'?'你發現多一'+m.group+'會多多少了！':
      s.station===0&&s.step===4?'你找到兩籃一樣多的蘋果了！':
      s.station===2&&s.step===6?'你發現乘法的小祕密了！':'做到了！';
    finish(praise);return;
  }
  message=feedback;s.hint=Math.min(4,s.hint+1);
  if(s.hint>=2&&s.station!==0)s.highlight=0;
  render();
}
function speak(text){
  if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined'){speechStatus('此瀏覽器無法朗讀，請看題目文字。');return}
  const voices=speechSynthesis.getVoices();
  const voice=voices.find(v=>/^zh[-_]TW$/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));
  if(voices.length&&!voice){speechStatus('裝置沒有中文語音，請看題目文字。');return}
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text.replaceAll('×','乘以').replaceAll('＝','等於').replaceAll('＋','加'));
  utterance.lang='zh-TW';if(voice)utterance.voice=voice;
  utterance.rate=prefs.slow ? 0.72 : 0.95;
  utterance.onerror=event=>{if(!['canceled','interrupted'].includes(event.error))speechStatus('目前無法朗讀，請看題目文字。')};
  speechSynthesis.speak(utterance);
}
function speechStatus(text){
  speechError=text;
  if($('speech'))$('speech').innerHTML=t(text);
  if($('dialog-status'))$('dialog-status').innerHTML=t(text);
}

const select=(name,label,options)=>'<label>'+t(label)+' <select data-pref="'+name+'">'+options.map(([v,l])=>'<option value="'+v+'" '+(String(prefs[name])===String(v)?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>';

const sketches=new Map();
let drawing=null;
function draw(){
  const id=taskKey()+':'+s.step;
  if(!sketches.has(id))sketches.set(id,{strokes:[],eraser:false,active:null});
  drawing=sketches.get(id);
  dialog('畫一畫', '<p>'+t('可以畫點點或圈圈，說說你怎麼想。')+'</p><canvas id="sketch" width="700" height="300" aria-label="畫圖區"></canvas><div class="row">'+btn('畫筆','pen')+btn('橡皮擦','eraser')+btn('復原','drawundo')+btn('清除畫圖','drawclear')+'</div>');
  const canvas=$('sketch');
  const point=event=>{
    const bounds=canvas.getBoundingClientRect();
    return [(event.clientX-bounds.left)/bounds.width*canvas.width,(event.clientY-bounds.top)/bounds.height*canvas.height];
  };
  canvas.onpointerdown=event=>{
    if(!event.isPrimary)return;
    canvas.setPointerCapture(event.pointerId);
    drawing.active={erase:drawing.eraser,points:[point(event)]};
    drawing.strokes.push(drawing.active);paint();
  };
  canvas.onpointermove=event=>{if(drawing.active&&canvas.hasPointerCapture(event.pointerId)){drawing.active.points.push(point(event));paint()}};
  canvas.onpointerup=canvas.onpointercancel=()=>{drawing.active=null};
  paint();
}
function paint(){
  const canvas=$('sketch'),ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const stroke of drawing.strokes){
    ctx.globalCompositeOperation=stroke.erase?'destination-out':'source-over';
    ctx.strokeStyle='#174b63';ctx.lineWidth=stroke.erase?24:5;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();const [x,y]=stroke.points[0];ctx.moveTo(x,y);ctx.lineTo(x+.01,y);
    for(const point of stroke.points.slice(1))ctx.lineTo(...point);
    ctx.stroke();
  }
}
function demoHint(m){
  const unit=m.unit===5?4:5, groups=m.groups===2?3:2;
  if(m.kind==='place'||m.kind==='build'){
    dialog('看看示範','<p>'+t('先放一朵花，再一朵一朵放，直到花束有 3 朵。')+'</p><div class="tray">'+glyph('flower').repeat(3)+'</div><p>'+t('關閉說明，回去試一次。')+'</p>');return;
  }
  const related=m.kind==='compare'
    ?'<p>'+t('多一束，就多 '+unit+' 朵花。')+'</p>'
    :'<p>'+t(unit+' 的 '+groups+' 倍是 '+unit*groups+'。')+'</p><p>'+unit+' × '+groups+' ＝ '+unit*groups+'</p>';
  dialog('看看示範','<p>'+t('每束 '+unit+' 朵花，有 '+groups+' 束。')+'</p><div class="board">'+('<div class="tray">'+glyph('flower').repeat(unit)+'</div>').repeat(groups)+'</div><p>'+Array(groups).fill(unit).join(' ＋ ')+' ＝ '+unit*groups+'</p>'+related+'<p>'+t('關閉說明，回去試一次。')+'</p>');
}

document.addEventListener('click',event=>{
  const el=event.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const [action,arg]=el.dataset.act.split(':');
  if(action==='home')return home();
  if(action==='start')return enter(0);
  if(action==='resume'&&saved){s=validState(saved);message='';render(true);autoRead();return}
  if(action==='station'&&allowed(+arg))return enter(+arg);
  if(action==='zy'){prefs.zy=!prefs.zy;save();render();return}
  if(action==='settings'||action==='teacher')return settings(action==='teacher');
  if(action==='instructions')return dialog('操作說明','<ol>'+instructions.map(line=>'<li>'+t(line)+'</li>').join('')+'</ol>'+btn('讀操作說明','readinstructions'));
  if(action==='readinstructions')return speak(instructions.join(''));
  if(action==='close'){$('dialog').close();return}
  if(action==='teacherjump'){$('dialog').close();return enter(+arg,+arg===3?prefs.unit:2)}
  if(action==='confirmclear')return dialog('清除學習紀錄','<p>'+t('確定清除這台裝置上的進度？')+'</p>'+btn('確定清除','wipe'));
  if(action==='wipe'){stop();done={};saved=null;s=null;visited=false;sketches.clear();$('dialog').close();save();render();return}
  if(!s)return;
  const m=task();
  switch(action){
    case 'unit':return enter(3,+arg);
    case 'resetstation':delete done[taskKey()];$('dialog').close();return enter(s.station,s.unit);
    case 'next':return next();
    case 'back':return back();
    case 'read':return speak(m.text.replaceAll('×','乘以'));
    case 'stop':return stop();
    case 'readsums':return speak(m.unit+' 乘以 '+m.groups+' 等於 '+m.total+'。');
    case 'hint':s.hint=Math.min(4,s.hint+1);if(s.station!==0&&s.hint===2)s.highlight=0;break;
    case 'example':return demoHint(m);
    case 'hide':s.hide=!s.hide;break;
    case 'add-basket':
      if(m.kind!=='compare'||s.solved||s.reveal)return;
      s.reveal=1;s.highlight=m.groups;
      save();render();
      document.querySelector('[data-act="highlight:'+m.groups+'"]')?.focus({preventScroll:true});
      return;
    case 'highlight':s.highlight=+arg;break;
    case 'reveal':s.reveal=Math.min(3,s.reveal+1);break;
    case 'answer':s.answer=arg;break;
    case 'check':return check();
    case 'observe':return finish(m.kind==='add'?'你找到數字對應的物品了！':'準備好拼算式了！');
    case 'fruit':if(Date.now()<ignoreClickUntil)return;selectedFruit=selectedFruit===+arg?null:+arg;break;
    case 'drop':return moveTo(+arg);
    case 'take':{
      const id=s.fruit.lastIndexOf(+arg+1);
      if(id>=0){previousMove=[...s.fruit];s.fruit[id]=0;message=''}
      break;
    }
    case 'undo':if(previousMove!==null){if(s.station===3)s.built=previousMove;else s.fruit=previousMove;previousMove=null;message=''}break;
    case 'build':{
      const amount=s.built;
      const value=Math.min(m.unit+1,Math.max(0,amount+Number(arg)));
      previousMove=s.built;s.built=value;break;
    }
    case 'groups':{
      const nextCount=Math.max(1,Math.min(limits(),s.groups+Number(arg)));
      if(nextCount===s.groups)return;
      resetTask();s.groups=nextCount;save();render();autoRead();return;
    }
    case 'slot':s.slot=+arg;break;
    case 'card':
      s.cards[s.slot]=+arg;s.slot=Math.min(2,s.slot+1);break;
    case 'clearcards':s.cards=[null,null,null];s.slot=0;break;
    case 'count':{
      stop();
      if(prefs.advanced&&s.station===3&&s.step===7)s.hide=false;
      let i=0;
      const current=s, step=s.step;
      const tick=()=>{
        if(current!==s||s.step!==step)return;
        if(i>=m.groups){s.highlight=-1;render();return}
        s.highlight=i++;
        message='數到第 '+i+' '+m.group+(i<m.groups?'，有 '+i*m.unit+' '+m.measure+'。':'。');
        render();timer=setTimeout(tick,650);
      };
      tick();return;
    }
    case 'draw':return draw();
    case 'pen':drawing.eraser=false;return speechStatus('已選畫筆。');
    case 'eraser':drawing.eraser=true;return speechStatus('已選橡皮擦。');
    case 'drawundo':drawing.strokes.pop();return paint();
    case 'drawclear':drawing.strokes=[];return paint();
    case 'words':return dialog('詞語解釋','<dl>'+[
      ['一組','把物品放在一起，就成了一組。'],['一樣多','兩邊的數量相同。'],['倍','有幾個相同的組，就是每組數量的幾倍。'],['乘號','用 × 記錄有幾個相同的數量。']
    ].map(([word,definition])=>'<dt><strong>'+t(word)+'</strong></dt><dd>'+t(definition)+'</dd>').join('')+'</dl>');
    default:return;
  }
  save();render();
  [...document.querySelectorAll('[data-act]')].find(node=>node.dataset.act===el.dataset.act)?.focus({preventScroll:true});
});

document.addEventListener('pointerdown',event=>{
  const fruit=event.target.closest('[data-fruit]');
  if(!fruit||!event.isPrimary||event.button!==0)return;
  drag={id:+fruit.dataset.fruit,pointer:event.pointerId,x:event.clientX,y:event.clientY,moved:false};
  fruit.setPointerCapture(event.pointerId);
});
document.addEventListener('pointermove',event=>{
  if(!drag||drag.pointer!==event.pointerId)return;
  if(Math.hypot(event.clientX-drag.x,event.clientY-drag.y)>8)drag.moved=true;
  if(!drag.moved)return;
  const over=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-basket]');
  document.querySelectorAll('[data-basket]').forEach(b=>b.classList.toggle('drop',b===over&&Boolean(b.querySelector('[data-act^="drop:"]'))));
});
document.addEventListener('pointerup',event=>{
  if(!drag||drag.pointer!==event.pointerId)return;
  const old=drag;drag=null;
  document.querySelectorAll('.drop').forEach(node=>node.classList.remove('drop'));
  if(!old.moved)return;
  ignoreClickUntil=Date.now()+250;
  const over=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-basket]');
  if(over?.querySelector('[data-act^="drop:"]')){selectedFruit=old.id;moveTo(+over.dataset.basket)}
